services:
  - type: web
    name: job-tracker-api
    env: php
    plan: free
    buildCommand: composer install --no-interaction --prefer-dist && npm install && npm run build
    startCommand: vendor/bin/heroku-php-apache2 public/
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: LOG_LEVEL
        value: warning
      - key: SESSION_SECURE_COOKIE
        value: true
      - key: SESSION_ENCRYPT
        value: true
      - fromGroup: job-tracker-api-env

envGroups:
  - name: job-tracker-api-env
    envVars:
      - key: APP_NAME
        value: HireSight
      - key: APP_URL
        scope: runtime
      - key: FRONTEND_URL
        scope: runtime
      - key: APP_KEY
        scope: runtime
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        scope: runtime
      - key: DB_PORT
        value: "3306"
      - key: DB_DATABASE
        scope: runtime
      - key: DB_USERNAME
        scope: runtime
      - key: DB_PASSWORD
        scope: runtime
      - key: GEMINI_API_KEY
        scope: runtime
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_API_URL
        value: https://generativelanguage.googleapis.com/v1beta/models
